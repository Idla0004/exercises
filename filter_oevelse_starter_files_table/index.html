<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>

  <body>
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Fuel</th>
          <th>Passengers</th>
          <th>Stops</th>
          <th>Owned By</th>
          <th>Electric</th>
          <th>Tandem</th>
        </tr>
      </thead>
      <tbody>
        <div class="buttons-flex">
          <button id="showAll" data-filter="el">Show All</button>
          <button id="electricVehicles" data-filter="mereendto">
            Electric vehicles
          </button>
          <button id="moreThanTwoSeats">More than 2 seats</button>
          <button id="electricOwnedByJonas">
            Electric vehicles owned by Jonas
          </button>
          <button id="extraseats">Ryebreads with at least 2 seats</button>
        </div>
      </tbody>
    </table>
  </body>
</html>
