<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="index.js"></script>
    <link rel="stylesheet" href="index.css" />
    <title>Document</title>
  </head>
  <body class="todo-body">
    <h1>TO-DO LISTE</h1>
    <div class="filterbuttons">
      <button id="filtertodo" data-action="todo" data-filter="todo">
        To Do
      </button>
      <button id="filterdone" data-action="done" data-filter="done">
        Done
      </button>
    </div>
    <section class="todo-box">
      <input type="text" id="todo_input" placeholder="Skriv din to-do" />
      <button class="todobtn">Tilføj to-do</button>
      <ul class="todo_container"></ul>
    </section>
  </body>
</html>
