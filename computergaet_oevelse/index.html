<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Computer gæt tal</title>
    <script type="module" src="../utils/utils_lib.js" defer></script>
    <script type="module" src="index.js" defer></script>
  </head>
  <body>
    <main>
      <section class="computer-gaet">
        <h1>Gæt et tal, computer!</h1>
        <h2 id="message"></h2>
        <button class="startgame">Start spil</button>
        <h2 class="computeranswer"></h2>
        <img src="img/higher.png" class="higher-img hidden" alt="go higher" />
        <img src="img/lower.png" class="lower-img hidden" alt="go lower" />
        <img src="img/winner.png" class="winner-img hidden" alt="you win!" />
        <div class="knapper">
          <button class="toohigh">For højt!</button>
          <button class="toolow">For lavt!</button>
          <button class="winner">Det er rigtigt!</button>
        </div>
      </section>
    </main>
  </body>
</html>
